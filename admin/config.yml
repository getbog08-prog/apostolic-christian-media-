backend:
  name: github
  repo: getbog08-prog/apostolic-christian-media-
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "teachings"
    label: "Christian Teachings"
    folder: "content/teachings"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "string"

      - label: "Teaching"
        name: "body"
        widget: "markdown"

      - label: "PDF File"
        name: "pdf"
        widget: "file"
        required: false

      - label: "Word/DOCX File"
        name: "docx"
        widget: "file"
        required: false

      - label: "Image"
        name: "image"
        widget: "image"
        required: false
